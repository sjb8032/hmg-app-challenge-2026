name: Tools - rest area data

# 임시 브랜치(tools/sdk-api-and-data)에서만 도는 작업.
# OpenStreetMap 한국 추출본(Geofabrik)에서 휴게소·졸음쉼터와 도시 위치를 뽑아 이 브랜치에 커밋한다.
on:
  push:
    branches: [ tools/sdk-api-and-data ]
    paths: [ '.github/workflows/tools-dump.yml' ]

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool

      - name: Download South Korea extract and filter
        run: |
          set -euo pipefail
          mkdir -p work
          curl -fsSL -o work/kr.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          curl -fsSL -o work/kr.state.txt https://download.geofabrik.de/asia/south-korea-updates/state.txt || true
          ls -la work
          osmium tags-filter work/kr.osm.pbf nwr/highway=rest_area,services n/place=city,town -o work/filtered.osm.pbf --overwrite
          osmium export work/filtered.osm.pbf -f geojsonseq -x print_record_separator=false -u type_id -o work/filtered.geojsonseq --overwrite
          wc -l work/filtered.geojsonseq

      - name: Convert to app data
        run: |
          set -euo pipefail
          mkdir -p tools-output/osm
          cat > work/convert.py <<'PY'
          import json, math, re, sys

          features = []
          with open('work/filtered.geojsonseq', encoding='utf-8') as f:
              for line in f:
                  line = line.strip().lstrip('\x1e')
                  if line:
                      features.append(json.loads(line))

          def coords_of(geom):
              out = []
              def walk(c):
                  if isinstance(c, (list, tuple)) and c and isinstance(c[0], (int, float)):
                      out.append((c[1], c[0]))
                  elif isinstance(c, (list, tuple)):
                      for x in c:
                          walk(x)
              walk(geom.get('coordinates', []))
              return out

          hangul = re.compile('[가-힣]')
          places = []
          areas = []
          for ft in features:
              props = ft.get('properties', {})
              name = props.get('name:ko') or props.get('name') or ''
              pts = coords_of(ft.get('geometry') or {})
              if not pts:
                  continue
              lat = sum(p[0] for p in pts) / len(pts)
              lon = sum(p[1] for p in pts) / len(pts)
              if props.get('place') in ('city', 'town'):
                  if name and hangul.search(name):
                      places.append({'name': name, 'place': props['place'], 'lat': lat, 'lon': lon,
                                     'population': props.get('population')})
                  continue
              hw = props.get('highway')
              if hw not in ('rest_area', 'services'):
                  continue
              if not name or not hangul.search(name):
                  continue
              if hw == 'services' or '휴게소' in name:
                  t = 'S'
              elif '졸음쉼터' in name:
                  t = 'D'
              else:
                  t = 'R'
              m = re.search(r'([가-힣]+)\s*(?:방향|방면)', name)
              areas.append({'id': str(props.get('@id') or props.get('id') or ft.get('id') or len(areas)),
                            'n': name, 't': t, 'lat': lat, 'lon': lon, 'dl': m.group(1) if m else None})

          suffix = re.compile(r'(특별시|광역시|특별자치시|특별자치도|시|군|구|읍|면)$')
          def base(n):
              return suffix.sub('', n)
          by_base = {}
          for p in places:
              key = base(p['name'])
              prev = by_base.get(key)
              if prev is None or (prev['place'] == 'town' and p['place'] == 'city'):
                  by_base[key] = p

          def dist_km(a_lat, a_lon, b_lat, b_lon):
              r = 6371.0
              dlat = math.radians(b_lat - a_lat)
              dlon = math.radians(b_lon - a_lon)
              h = math.sin(dlat / 2) ** 2 + math.cos(math.radians(a_lat)) * math.cos(math.radians(b_lat)) * math.sin(dlon / 2) ** 2
              return 2 * r * math.asin(min(1.0, math.sqrt(h)))

          aliases = {'부상': '부산'}  # OSM 이름 오타
          for a in areas:
              if a['dl'] in aliases:
                  a['dl'] = aliases[a['dl']]

          # 같은 시설이 면과 점으로 겹쳐 들어간 경우만 하나로 합친다.
          # 양방향 휴게소는 이름이 같아도 서로 다른 위치이므로 남겨 둔다 (앱에서 진행 방향 쪽을 고른다).
          def norm(n):
              return re.sub(r'\s+', '', n)
          shapes = [a for a in areas if not a['id'].startswith('n')]
          points = [a for a in areas if a['id'].startswith('n')]
          kept = []
          for a in shapes:
              if any(norm(k['n']) == norm(a['n']) and dist_km(k['lat'], k['lon'], a['lat'], a['lon']) < 0.08 for k in kept):
                  continue
              kept.append(a)
          shape_count = len(kept)
          for a in points:
              if any(norm(k['n']) == norm(a['n']) and dist_km(k['lat'], k['lon'], a['lat'], a['lon']) < 0.6 for k in kept[:shape_count]):
                  continue
              if any(norm(k['n']) == norm(a['n']) and dist_km(k['lat'], k['lon'], a['lat'], a['lon']) < 0.08 for k in kept[shape_count:]):
                  continue
              kept.append(a)

          matched = 0
          out = []
          for a in kept:
              item = {'id': a['id'], 'n': a['n'], 't': a['t'],
                      'lat': round(a['lat'], 5), 'lon': round(a['lon'], 5)}
              if a['dl']:
                  item['dl'] = a['dl']
                  p = by_base.get(a['dl'])
                  if p:
                      item['dlat'] = round(p['lat'], 4)
                      item['dlon'] = round(p['lon'], 4)
                      matched += 1
              out.append(item)
          out.sort(key=lambda x: (x['lat'], x['lon']))

          with open('tools-output/osm/rest_areas.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, separators=(',', ':'))
          with open('tools-output/osm/places.json', 'w', encoding='utf-8') as f:
              json.dump(places, f, ensure_ascii=False, indent=0)

          counts = {}
          for x in out:
              counts[x['t']] = counts.get(x['t'], 0) + 1
          labelled = sum(1 for x in out if 'dl' in x)
          unmatched = sorted({x['dl'] for x in out if 'dl' in x and 'dlat' not in x})
          with open('tools-output/osm/summary.txt', 'w', encoding='utf-8') as f:
              f.write(f"features={len(features)} places={len(places)} areas_raw={len(areas)} kept={len(out)}\n")
              f.write(f"by_type={counts}\n")
              f.write(f"direction_labelled={labelled} matched={matched}\n")
              f.write("unmatched_labels=" + ','.join(unmatched) + "\n")
              for x in out:
                  if any(k in x['n'] for k in ('기흥', '안성', '망향', '입장', '천안', '죽전')):
                      f.write(json.dumps(x, ensure_ascii=False) + "\n")
          print(open('tools-output/osm/summary.txt', encoding='utf-8').read()[:3000])
          PY
          python3 work/convert.py
          cp work/kr.state.txt tools-output/osm/geofabrik-state.txt 2>/dev/null || true

      - name: Commit results to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools-output
          git commit -q -m "tools: OSM rest area data" || echo "nothing to commit"
          git push -q origin HEAD:${GITHUB_REF_NAME}
